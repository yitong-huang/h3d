[project]
name = "h3d-api"
version = "0.1.0"
description = "H3D FastAPI inference gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "pydantic==2.10.4",
  "numpy==2.2.1",
  "Pillow==11.1.0",
  "aiofiles==24.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
